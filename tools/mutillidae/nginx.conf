# /etc/nginx/sites-available/mutillidae.sacheth.tech
# Plain HTTP, like vuln-lab: the scanner needs a DNS-only record, and the
# Cloudflare origin certificate is only trusted through the Cloudflare proxy.
server {
    listen 80;
    listen [::]:80;
    server_name mutillidae.sacheth.tech;

    # Well-known file verification, served by nginx so the container is untouched.
    location = /.well-known/wvs-verification.txt {
        alias /var/www/mutillidae/wvs-verification.txt;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        # Keep Mutillidae's own Apache/PHP banners (P-17) instead of nginx's.
        proxy_pass_header Server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
