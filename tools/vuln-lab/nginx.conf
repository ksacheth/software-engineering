# /etc/nginx/sites-available/vuln-lab.sacheth.tech
# Plain HTTP on purpose: no redirect to HTTPS (A-14) and no HSTS (P-02).
server {
    listen 80;
    listen [::]:80;
    server_name vuln-lab.sacheth.tech;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        # Keep the lab's own version banner (P-17) instead of nginx's.
        proxy_pass_header Server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
