# /etc/nginx/sites-available/juice.sacheth.tech
# Plain HTTP, like vuln-lab. The Cloudflare origin certificate is only trusted
# through the Cloudflare proxy, and the scanner needs a DNS-only record.
server {
    listen 80;
    listen [::]:80;
    server_name juice.sacheth.tech;

    # Well-known file verification. DNS TXT is the method this target uses,
    # but the file keeps the other method available without touching the app.
    location = /.well-known/wvs-verification.txt {
        alias /var/www/juice-shop/wvs-verification.txt;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        # Socket.IO, which Juice Shop uses for its challenge notifications.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
