# F.8 / DC-7: the `web` container. Serves the dashboard build and proxies the
# API and the scan WebSocket to the `api` service, so the browser sees one
# origin (the dashboard's production WebSocket URL is same-origin /ws).
#
# Plain HTTP on 8080. TLS (NFR-SEC-1) is terminated in front of this container;
# deploy/nginx.conf is that front for a host with a certificate.

# Keep the original scheme when a TLS front already set it.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Matches express.json({ limit: "1mb" }) in the API.
    client_max_body_size 1m;

    # Docker's embedded DNS. Resolving per request, through a variable, means a
    # restarted or scaled `api` service is found again instead of nginx holding
    # the address it saw at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:4100;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Report downloads stream from the API; buffering them to disk here
        # only adds latency.
        proxy_buffering off;
    }

    location = /ws {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vite fingerprints everything under /assets, so it can be cached for good.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the single-page app. index.html is never cached, so a
    # deploy reaches users on their next load.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
