# NFR-SEC-1 browser controls for the dashboard. Included by every location that
# sets its own headers, because nginx drops inherited add_header directives in
# any block that declares one.
#
# connect-src names the WebSocket origin explicitly ($http_host keeps the port,
# which $host would drop on the :8080 demo address).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://$http_host wss://$http_host; img-src 'self' data:; font-src 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
