# TLS front for a host running the container stack (docker-compose.yml,
# `app` profile). Terminates HTTPS (NFR-SEC-1: TLS 1.2+) and hands everything
# to the `web` container, which serves the dashboard, proxies /api and /ws, and
# sets the browser security headers (deploy/nginx/wvs.conf).
#
# The port below must match DEPLOY_HTTP_PORT in .env (default 8080), and
# PUBLIC_URL must be the https:// address this server answers on.
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/wvs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wvs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The scan WebSocket (/ws) is upgraded through this same location.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
